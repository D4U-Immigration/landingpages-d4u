server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compressão (necessária para a nota 100 no PageSpeed)
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml font/woff2;

  # URLs sempre com barra no fim (/pt-br/eb2-niw/), como o Astro gera
  absolute_redirect off;

  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
  }

  # Arquivos com hash ou versionados: cache longo
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # Fotos/fontes sem hash no nome: 30 dias (ao trocar uma foto, use um nome novo para atualizar na hora)
  location /assets/ {
    add_header Cache-Control "public, max-age=2592000";
  }

  location = /llms.txt { default_type "text/plain; charset=utf-8"; }
}
